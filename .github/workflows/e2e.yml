# Päästä päähän -testit (Playwright) rakennettua sivustoa vastaan: toiminnot, saavutettavuus (axe)
# ja koko sivun kuvakaappausvertailu kahdella leveydellä. Ajetaan Playwrightin omassa Docker-kuvassa,
# jotta fontit ja renderöinti ovat joka ajossa samat kuin vertailukuvissa. Kuvan versio = @playwright/test
# package.jsonissa (1.63.0): kun päivität paketin, päivitä myös tämä kuva ja ota vertailukuvat uudestaan.
#
# Kaksi tapaa ajaa:
# 1. Jokainen PR: testit ajetaan, erot ladataan artefaktiksi ja PR:ään tulee kommentti linkillä.
#    Lisäksi odotetaan Cloudflare Pagesin esikatselua ja ajetaan scripts/verify_live.py sitä vastaan
#    (rikkinäiset linkit ja kuvat).
# 2. Actions-välilehdeltä käsin (workflow_dispatch) main-haarasta syötteellä paivita-vertailukuvat:
#    kuvat otetaan uudestaan ja committataan haaraan vertailukuvat/<päivä>, josta avataan PR.
#    Mainiin ei committata suoraan (CLAUDE.md: ei koskaan suoraan main-haaraan ilman PR:ää).
name: E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      paivita-vertailukuvat:
        description: "Ota vertailukuvat uudestaan tästä haarasta ja avaa niistä PR"
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  testit:
    name: Playwright (toiminnot, axe, kuvat)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v4

      - name: Riippuvuudet
        run: npm ci

      - name: Tuotantobuild
        run: npm run build

      - name: Testit
        if: ${{ github.event.inputs.paivita-vertailukuvat != 'true' }}
        id: testit
        run: npx playwright test

      - name: Vertailukuvat uudestaan
        if: ${{ github.event.inputs.paivita-vertailukuvat == 'true' }}
        run: npx playwright test tests/e2e/kuvakaappaukset.spec.ts --update-snapshots

      - name: Raportti ja erot artefaktiksi
        if: always()
        uses: actions/upload-artifact@v4
        id: artefakti
        with:
          name: playwright-${{ github.run_number }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Kommentti PR:ään
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          TULOS: ${{ steps.testit.outcome }}
          ARTEFAKTI_URL: ${{ steps.artefakti.outputs.artifact-url }}
        with:
          script: |
            const tulos = process.env.TULOS === 'success' ? 'läpi' : 'EPÄONNISTUI';
            const ajo = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const tunnus = '<!-- e2e-kommentti -->';
            const body = [
              tunnus,
              `**E2E-testit: ${tulos}** (puhelin 390 px ja työpöytä 1280 px)`,
              '',
              `- [Ajon loki](${ajo})`,
              process.env.ARTEFAKTI_URL ? `- [Raportti ja erokuvat (artefakti)](${process.env.ARTEFAKTI_URL})` : '- Artefaktia ei syntynyt',
              '',
              'Kuvakaappaustesti ohitetaan sivuilta, joilla ei ole vertailukuvaa. Uudet vertailukuvat: Actions → E2E → Run workflow → paivita-vertailukuvat.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const vanha = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith(tunnus));
            if (vanha) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: vanha.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Vertailukuvat PR:ksi
        if: ${{ github.event.inputs.paivita-vertailukuvat == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: tests/e2e/vertailukuvat
          branch: vertailukuvat/${{ github.run_number }}
          commit-message: "Päivitä kuvakaappausten vertailukuvat"
          title: "Päivitä kuvakaappausten vertailukuvat"
          body: |
            Vertailukuvat otettu uudestaan haarasta `${{ github.ref_name }}` Playwrightin Docker-kuvassa (E2E-työ, ajo ${{ github.run_number }}).
            Tarkista erot ennen mergeä: nämä kuvat ovat jatkossa totuus, johon jokaisen PR:n kuvia verrataan.
          draft: true

  esikatselu:
    name: Cloudflare-esikatselu (verify_live)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Odota Cloudflare Pagesin esikatselua
        id: esikatselu
        env:
          HAARA: ${{ github.head_ref }}
        run: |
          # Cloudflare muuttaa haaran nimen aliakseksi: pienet kirjaimet, muut kuin a–z0–9 viivaksi.
          ALIAS=$(echo "$HAARA" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-28)
          URL="https://${ALIAS}.talon-maalaus-ja-kattopalvelut-pirkanmaalla---pintanen.pages.dev"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # Odotetaan, että esikatselu palvelee tämän commitin buildin: build kirjoittaa commitin sitemapin lastmodit,
          # joten tarkistetaan vain, että sivusto vastaa 200 ja sitemap on olemassa. Enintään 12 minuuttia.
          for i in $(seq 1 48); do
            KOODI=$(curl -s -o /dev/null -w '%{http_code}' "$URL/sitemap.xml" || true)
            if [ "$KOODI" = "200" ]; then echo "esikatselu vastaa: $URL"; exit 0; fi
            echo "odotetaan ($i/48), sitemap.xml -> $KOODI"; sleep 15
          done
          echo "::warning::Esikatselu ei vastannut 12 minuutissa: $URL. Ohitetaan verify_live."
          echo "ohita=1" >> "$GITHUB_OUTPUT"

      - name: verify_live.py esikatselua vastaan
        if: steps.esikatselu.outputs.ohita != '1'
        run: |
          python3 scripts/verify_live.py "${{ steps.esikatselu.outputs.url }}" live-esikatselu
          python3 scripts/verify_dist.py live-esikatselu
