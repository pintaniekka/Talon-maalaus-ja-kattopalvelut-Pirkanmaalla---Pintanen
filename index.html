<!doctype html>

    <!-- Fontit (Montserrat, Open Sans) tarjoillaan omalta palvelimelta @fontsource-paketeista (ks. src/main.tsx) -->

    <!-- Favicon – SVG primary (Google-supported), PNG fallback -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Critical inline CSS for above-the-fold paint.
         :where() nollaa spesifisyyden, jotta nämä toimivat vain ennen varsinaisen CSS:n
         latautumista eivätkä jyrää Tailwind-luokkia (esim. alasivujen valkoista hero-otsikkoa). -->
    <style>
      body { margin: 0; }
      :where(.hero-critical) { background: #F7F7F7; }
      :where(.hero-critical h1) { color: #1a1a1a; font-size: 2rem; line-height: 1.1; }
      :where(.hero-critical .hero-lead) { color: #4b5563; font-size: 1.125rem; }
    </style>

    <!-- Preload Hero Image for LCP – vain etusivulla; vite-plugin-spa-routes poistaa tämän alasivujen kopioista -->
    <link
      data-home-only
      rel="preload"
      as="image"
      href="/images/Eerik-maalaa/Eerik-maalaa-kattoa-1500.avif"
      imagesrcset="/images/Eerik-maalaa/Eerik-maalaa-kattoa-400.avif 400w, /images/Eerik-maalaa/Eerik-maalaa-kattoa-800.avif 800w, /images/Eerik-maalaa/Eerik-maalaa-kattoa-1200.avif 1200w, /images/Eerik-maalaa/Eerik-maalaa-kattoa-1500.avif 1500w"
      imagesizes="(max-width: 1024px) 100vw, 34vw"
      type="image/avif"
      fetchpriority="high"
    />

    <!-- Ilman JavaScriptiä esirenderöidyn sivun animoidut osiot jäisivät läpinäkyviksi
         (framer-motionin alkutila). Näytetään ne suoraan. -->
    <noscript>
      <style>
        [style*="opacity:0"], [style*="opacity: 0"] { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
